# Keeps the pinned Actions and the optional Python extras current.
# The core package has no runtime dependencies, so "pip" here only ever
# touches dev tools and the [dashboard] extra.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
