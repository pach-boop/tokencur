name: price-watch

# Daily refresh of the vendored LiteLLM pricing snapshot. Commits only
# when rates actually changed, so the git history doubles as a dated
# log of AI price changes.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the refreshed snapshot is committed back
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/update_pricing_snapshot.py
      # Pushes made with GITHUB_TOKEN don't trigger the ci workflow, so
      # the refreshed snapshot must pass the suite here before it lands.
      - run: pip install -e .[dev] && pytest -q
      - name: Commit price changes, if any
        run: |
          if git diff --quiet; then
            echo "No price changes today."
            exit 0
          fi
          git config user.name "price-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tokencur/pricing_data/litellm_snapshot.json
          git commit -m "chore(prices): LiteLLM snapshot refresh — rates changed upstream"
          git push
