name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the checkout.
permissions:
  contents: read

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev] # ruff's pin lives in pyproject.toml
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Coverage runs where every optional extra is installed.
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: true
          # The agents run on macOS and Windows too; so must the parsers,
          # the ledger and the CLI.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .[dev]
      - run: pip install -e .[dashboard]
        if: matrix.coverage
      - run: pytest -q
        if: ${{ !matrix.coverage }}
      - run: pytest -q --cov --cov-report=term --cov-fail-under=90
        if: matrix.coverage
      # The conformance gate needs Python 3.12+ (focus-validator's floor);
      # the package itself still supports and tests 3.11.
      - run: pip install focus-validator==2.2.1 # pinned; bump deliberately
        if: runner.os == 'Linux' && matrix.python-version != '3.11'
      - run: python scripts/validate_focus.py
        if: runner.os == 'Linux' && matrix.python-version != '3.11'

  package:
    name: package (build, check, install the wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      # Outside the source tree, so only what the wheel ships can answer:
      # the console script, and the pricing snapshot as package data.
      - name: The installed wheel works on its own
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/tokencur --version
          wheel-env/bin/python -c "from tokencur.pricing import rates_for; assert rates_for('gpt-5.4'), 'pricing snapshot not packaged'"
