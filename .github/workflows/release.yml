name: release

# On a version tag (vX.Y.Z): build the sdist and wheel, attest their
# build provenance, and open a draft GitHub release with them attached;
# the maintainer writes the notes and publishes it. The same tag
# publishes to PyPI through trusted publishing (no stored token) while
# the repository variable PUBLISH_TO_PYPI is "true"; see
# CONTRIBUTING.md, "Releasing".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the provenance attestation
      attestations: write # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag names the version the package declares
        run: |
          version="$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/tokencur/__init__.py").read_text(encoding="utf-8")).group(1))')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tokencur.__version__ $version"
            exit 1
          fi
      - run: pip install build==1.6.1 twine==7.0.0
      - run: python -m build
      - run: twine check --strict dist/*
      # The pricing snapshot is a dataset in its own right: published and
      # attested next to the package, so where the prices came from can be
      # checked without unpacking the wheel. It stays out of dist/, which
      # twine and PyPI accept only distributions in.
      - name: The pricing dataset as its own release asset
        run: |
          mkdir release-assets
          cp src/tokencur/pricing_data/litellm_snapshot.json \
            "release-assets/tokencur-pricing-snapshot-${GITHUB_REF_NAME#v}.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            release-assets/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          retention-days: 30

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/
      - name: Draft the release with the built, attested files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* release-assets/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME"
          --notes "Draft: write the notes from CHANGELOG.md, then publish."

  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/tokencur
    permissions:
      id-token: write # trusted publishing: PyPI verifies this workflow, no token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
