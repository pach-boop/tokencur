[project]
name = "tokencur"
dynamic = ["version"]  # single source: tokencur.__version__
description = "Convert multi-provider AI/LLM usage data into FOCUS-conformant cost datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Aguayo Chávez", email = "aguayochavezpedro@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["finops", "focus", "ai", "llm", "cost", "tokens", "showback", "claude-code", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pach-boop/tokencur"
Changelog = "https://github.com/pach-boop/tokencur/blob/main/CHANGELOG.md"
Issues = "https://github.com/pach-boop/tokencur/issues"
Observatory = "https://pach-boop.github.io/tokencur/observatory/"

[project.scripts]
tokencur = "tokencur.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "hypothesis>=6.168",
    # Pinned: formatter output must be identical on every machine and in CI.
    "ruff==0.16.10",
]
dashboard = ["streamlit>=1.35", "duckdb>=1.0"]

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tokencur.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokencur = ["pricing_data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Same trap as .gitignore: global excludes such as *token* would hide the
# whole package from ruff. Its built-in excludes (.venv, build...) still apply.
respect-gitignore = false

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, ruff-specific,
# comprehensions, misc, perflint, return-statement hygiene.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PERF", "RET"]
# Line length is the formatter's job; the long lines left are prose in
# the HTML templates, where wrapping would only churn generated pages.
ignore = ["E501"]
# Typographic signs are intended: counts such as `model ×3`, `− removed`.
allowed-confusables = ["×", "−"]

[tool.ruff.lint.flake8-comprehensions]
# dict(key=value) reads better than a literal for keyword-style defaults.
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
known-first-party = ["tokencur"]

[tool.coverage.run]
source = ["tokencur"]
branch = true
# Streamlit's AppTest runs the dashboard where coverage cannot trace it;
# tests/test_dashboard.py still executes it whenever the extra is installed.
omit = ["*/tokencur/dashboard.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A leaked file or database handle fails the suite instead of passing
# with a warning nobody reads.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
